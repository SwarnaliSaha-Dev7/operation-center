services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    # env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=root.settings
      - DB_HOST=db
      - DB_PORT=5432
    command: sh -c "
      python manage.py collectstatic --noinput --settings=root.settings 2>/dev/null || true &&
      python manage.py makemigrations --noinput --settings=root.settings 2>/dev/null || true &&
      python manage.py migrate --noinput --settings=root.settings 2>/dev/null || true &&
      python manage.py check_superuser --settings=root.settings 2>/dev/null || true &&
      python manage.py runserver 0.0.0.0:9000
      "
    ports:
      - "9001:9000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-operation_center}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-operation_center}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:
