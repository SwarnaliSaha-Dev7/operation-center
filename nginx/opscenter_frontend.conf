server {

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.ellbob.com;
    root /srv/operation-center;

    ssl_certificate     /etc/nginx/ssl/opscenter.crt;
    ssl_certificate_key /etc/nginx/ssl/opscenter.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:9000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }


    location /static {
        alias /srv/operation-center/static;
        autoindex off;
    }

    location /media {
        alias /srv/operation-center/media;
        autoindex off;
    }
}