{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | OpsCenter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>body { font-family: 'Roboto', sans-serif; }</style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-100 flex items-center justify-center p-6 antialiased">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl sm:text-7xl font-bold text-indigo-200 tabular-nums mb-6">500</div>
        <h1 class="text-2xl font-semibold text-slate-800 mb-2">{{ title }}</h1>
        <p class="text-slate-600 mb-8">{{ message }}</p>
        <a href="{% url 'dashboardapp:Dashboard' %}" class="inline-flex items-center justify-center px-4 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors">Go to Dashboard</a>
    </div>
</body>
</html>
