{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OpsCenter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>body { font-family: 'Roboto', sans-serif; }</style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/40 to-slate-100 flex items-center justify-center p-4 antialiased">
    <div class="w-full max-w-sm">
        <a href="{% url 'dashboardapp:Dashboard' %}" class="flex items-center justify-center gap-2 text-xl font-semibold text-slate-800 mb-8">
            <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-indigo-700 text-white text-sm font-bold shadow-lg">O</span>
            OpsCenter
        </a>
        <div class="bg-white rounded-xl border border-slate-200 shadow-lg p-6 border-l-4 border-l-indigo-500">
            <h1 class="text-lg font-semibold text-slate-800 mb-5">Sign in</h1>
            {% if form.non_field_errors %}
            <div class="mb-4 rounded-lg bg-red-50 text-red-800 text-sm font-medium px-4 py-3 border border-red-200">{{ form.non_field_errors.0 }}</div>
            {% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-4">
                    <label for="id_username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <input type="text" name="username" id="id_username" autofocus autocapitalize="none" autocomplete="username" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    {% if form.username.errors %}<p class="mt-1 text-sm text-red-600">{{ form.username.errors.0 }}</p>{% endif %}
                </div>
                <div class="mb-5">
                    <label for="id_password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input type="password" name="password" id="id_password" autocomplete="current-password" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    {% if form.password.errors %}<p class="mt-1 text-sm text-red-600">{{ form.password.errors.0 }}</p>{% endif %}
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
