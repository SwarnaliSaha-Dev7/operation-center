{% if show_team_filter %}
<form method="get" class="inline-flex items-center gap-2" id="hardwareTeamFilterForm">
    <label for="hardwareTeamFilter" class="text-sm font-medium text-slate-700 whitespace-nowrap">Team</label>
    <select name="team" id="hardwareTeamFilter"
        class="min-w-[10rem] px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        onchange="this.form.submit()">
        <option value=""{% if not selected_team_id %} selected{% endif %}>All teams</option>
        {% for t in teams %}
        <option value="{{ t.pk }}"{% if selected_team_id == t.pk %} selected{% endif %}>{{ t.name }}</option>
        {% endfor %}
    </select>
</form>
{% endif %}
