{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-2xl">
    <h1 class="text-2xl font-semibold text-slate-800 mb-2">{{ title }}</h1>
    <p class="text-slate-600 mb-6">Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
    <form method="post" class="flex flex-wrap gap-3">
        {% csrf_token %}
        {% if perms.hardwareapp.delete_processortable %}<button type="submit" class="inline-flex items-center justify-center px-4 py-2.5 rounded-lg bg-red-600 text-white text-sm font-medium hover:bg-red-700 transition-colors">Delete</button>{% endif %}
        <a href="{% url 'hardwareapp:processor_list' %}" class="inline-flex items-center justify-center px-4 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition-colors">Cancel</a>
    </form>
</div>
{% endblock %}
