{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="min-h-[60vh] flex items-center justify-center">

    <!-- CARD -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">

        <!-- TOP ACCENT -->
        <div class="h-1 bg-gradient-to-r from-red-500 via-rose-500 to-pink-500"></div>

        <!-- CONTENT -->
        <div class="p-6 text-center">

            <!-- ICON -->
            <div class="mx-auto mb-4 flex items-center justify-center w-14 h-14 rounded-full 
                        bg-red-100 text-red-600 text-2xl">
                🗑
            </div>

            <!-- TITLE -->
            <h1 class="text-xl font-semibold text-slate-800">
                {{ title }}
            </h1>

            <!-- MESSAGE -->
            <p class="text-slate-600 mt-2 mb-6">
                Are you sure you want to delete 
                <strong class="text-slate-900">
                    {{ object_display|default:"this item" }}
                </strong>?
            </p>

            <!-- ACTIONS -->
            <form method="post" class="flex flex-col sm:flex-row gap-3 justify-center">
                {% csrf_token %}

                {% if can_delete %}
                <button type="submit"
                    class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2.5 rounded-xl 
                           bg-gradient-to-r from-red-500 to-rose-600 
                           text-white text-sm font-semibold shadow-md
                           hover:from-red-600 hover:to-rose-700 
                           hover:shadow-lg transition-all duration-200">
                    Delete
                </button>
                {% endif %}

                <a href="{{ cancel_url }}"
                   class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2.5 rounded-xl 
                          border border-slate-300 bg-white text-slate-700 text-sm font-semibold 
                          hover:bg-slate-50 transition">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
